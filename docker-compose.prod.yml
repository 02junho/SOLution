# 배포용 (서버 1대). 서버에서는 빌드하지 않고 GHCR 이미지를 받아 띄운다.
# 이미지를 GHCR에 올리는 GitHub Actions 작업은 다음 단계(서버를 만든 뒤 ci.yml에 배포 작업과 함께)에서 추가한다.
# 그 전에 서버에서 쓰려면 README "7. 배포용 구성"의 수동 게시 순서대로 올린다.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 밖에는 화면(nginx) 80번만 연다. DB(5432)·Spring(8080)·FastAPI(8000)는 컨테이너끼리만 쓴다.
# .env는 서버에만 둔다 (.env.example 참고, 저장소·노션·단톡방에 올리지 않기).
#
# 로컬에서 같은 구성을 확인할 때는 이미지를 먼저 이 이름으로 빌드한다.
#   docker build -t ghcr.io/02junho/solution-backend:latest ./backend
#   docker build -t ghcr.io/02junho/solution-ai-server:latest ./ai-server
#   docker build -t ghcr.io/02junho/solution-frontend:latest ./frontend
#   docker compose -f docker-compose.prod.yml up -d  → http://localhost
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 채워 주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-server:
    image: ghcr.io/02junho/solution-ai-server:latest
    env_file: .env
    environment:
      DB_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 테이블은 backend가 뜰 때 Flyway로 만든다.
  backend:
    image: ghcr.io/02junho/solution-backend:latest
    env_file: .env
    environment:
      DB_HOST: db
      POSTGRES_PORT: 5432
      AI_SERVER_URL: http://ai-server:8000
      QUOTE_TOOLS_URL: http://ai-server:8000
      BACKEND_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      ai-server:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ghcr.io/02junho/solution-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
