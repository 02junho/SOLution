# 배포에서 개발 서버(Vite) 대신 화면과 /api를 한 주소(80)로 내준다.
# 화면은 /api만 부르고 FastAPI는 직접 부르지 않으므로, 넘길 곳은 Spring(backend:8080) 하나다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # backend 컨테이너만 새로 바뀌어 IP가 달라져도 따라가도록, 주소를 Docker DNS(127.0.0.11)에서 10초마다 다시 찾는다.
  # proxy_pass에 변수를 쓰면 시작할 때 한 번만 찾지 않고 요청 때 찾는다. 주소 뒤에 경로를 붙이지 않아 /api/... 그대로 넘어간다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8080;

  location /api/ {
    proxy_pass $backend_upstream;
    # 브라우저 주소의 Host를 그대로 넘겨야 Spring이 같은 출처로 보고 저장(POST)을 막지 않는다(CORS 403).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Spring → FastAPI 읽기 제한(application.yml read-timeout 120s)보다 길게 둔다.
    proxy_read_timeout 130s;
  }

  # 새로 배포하면 바로 새 화면을 받도록 index.html은 캐시하지 않는다. (js·css는 파일 이름에 해시가 붙는다)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 새로고침하거나 주소를 직접 열어도 404 대신 화면을 내준다.
  location / {
    try_files $uri /index.html;
  }
}
