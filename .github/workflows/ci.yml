# PR·push마다 각 서버의 테스트·빌드와, docker compose로 셋을 함께 띄운 연결 확인을 한다.
# 배포(CD)는 여기서 하지 않는다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Spring 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

  ai-server:
    name: FastAPI 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: 화면 린트·빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: compose 연결 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: .env 만들기 (CI 전용 값)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env

      - name: DB·FastAPI·Spring 띄우기
        run: docker compose up -d --build

      # Spring → DB, Spring → FastAPI → DB가 모두 ok가 될 때까지 최대 3분 기다린다.
      - name: 연결 확인 (/api/v1/system/health)
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS http://localhost:8080/api/v1/system/health || true)
            if [ -n "$body" ] && echo "$body" | jq -e '
                .status == "ok"
                and .data.database == "ok"
                and .data.ai_server.ai_server == "ok"
                and .data.ai_server.database == "ok"' > /dev/null; then
              echo "$body" | jq .
              exit 0
            fi
            sleep 3
          done
          echo "연결 확인 실패. 마지막 응답: ${body:-없음}"
          exit 1

      - name: Flyway가 만든 테이블 확인 (8개)
        run: |
          count=$(docker compose exec -T db psql -U solution -d solution -Atc \
            "select count(*) from information_schema.tables where table_schema = 'public' and table_name <> 'flyway_schema_history'")
          echo "테이블 수: $count"
          test "$count" = "8"

      - name: 실패하면 서버 로그 출력
        if: failure()
        run: docker compose logs --no-color

      - name: 정리
        if: always()
        run: docker compose down -v
